name: Build & Release Snowy for Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach SnowyWindows.exe to (e.g. v1.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile SnowyWindows.exe with native Windows csc.exe
        shell: pwsh
        run: |
          $csc = "$env:SystemRoot\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) {
            $csc = "$env:SystemRoot\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          }
          if (-not (Test-Path $csc)) {
            throw "Windows .NET Framework 4.x csc.exe not found."
          }

          $resArgs = @()
          if (Test-Path "wallpapers") {
            Get-ChildItem -Path "wallpapers" -Filter "*.jpg" | ForEach-Object {
              $resArgs += "/resource:$($_.FullName),$($_.Name)"
            }
          }

          Write-Host "Pass 1: Compiling SnowyWindows.exe with $csc ($($resArgs.Count) wallpaper resources)"
          & $csc /nologo /target:winexe /optimize+ @resArgs /r:System.dll,System.Drawing.dll,System.Windows.Forms.dll /out:SnowyWindows.exe SnowyWindows.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Write-Host "Pass 2: Generating SnowyIcon.ico..."
          $proc = Start-Process -FilePath ".\SnowyWindows.exe" -ArgumentList "--make-icon" -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0 -or -not (Test-Path "SnowyIcon.ico")) {
            throw "Failed to generate SnowyIcon.ico (exit code: $($proc.ExitCode))"
          }

          Write-Host "Pass 3: Recompiling SnowyWindows.exe with embedded SnowyIcon.ico and wallpapers..."
          & $csc /nologo /target:winexe /optimize+ /win32icon:SnowyIcon.ico @resArgs /r:System.dll,System.Drawing.dll,System.Windows.Forms.dll /out:SnowyWindows.exe SnowyWindows.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Get-Item SnowyWindows.exe | Select-Object Name, Length

      - name: Publish or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          Write-Host "Target release tag: $tag"

          $exists = $false
          try {
            gh release view $tag > $null 2>&1
            if ($LASTEXITCODE -eq 0) { $exists = $true }
          } catch {
            $exists = $false
          }

          if ($exists) {
            Write-Host "Release $tag already exists; uploading SnowyWindows.exe..."
            gh release upload $tag SnowyWindows.exe --clobber
          } else {
            Write-Host "Creating new release $tag with SnowyWindows.exe..."
            gh release create $tag SnowyWindows.exe --title "Snowy for Windows $tag" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
